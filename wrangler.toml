name = "conspread"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# -------------------------------------------------------
# KV Namespaces
# After creating KV namespaces in the Cloudflare Dashboard,
# paste the IDs below. See DEPLOY.md for GUI steps.
# -------------------------------------------------------
[[kv_namespaces]]
binding = "SESSIONS"
id = "a20a639acbe34da5a77fd95287aba973"

[[kv_namespaces]]
binding = "CHATS"
id = "3fb48d9b4f754ab893abde8943767802"

# -------------------------------------------------------
# HF_MODEL: The Qwen model used for inference.
# The user's HuggingFace OAuth token (inference-api scope)
# is passed directly — no separate HF API key needed.
# -------------------------------------------------------
[vars]
HF_MODEL = "Qwen/Qwen2.5-72B-Instruct"

# -------------------------------------------------------
# Secrets — add via Cloudflare Dashboard (NOT here).
# Dashboard → Workers & Pages → kwen-council
#           → Settings → Variables & Secrets → Add
#
# HF_CLIENT_ID      — from HuggingFace Connected Apps page
# HF_CLIENT_SECRET  — from HuggingFace Connected Apps page
# REDIRECT_URI      — https://kwen-council.<your-account>.workers.dev/api/auth/callback
# APP_URL           — https://kwen-council.<your-account>.workers.dev
# -------------------------------------------------------
